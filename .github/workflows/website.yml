name: Build and deploy website

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh Google Scholar publications
        if: github.event_name != 'pull_request'
        run: python scripts/sync_scholar.py --allow-cached
      - name: Build the site
        run: python scripts/build.py
      - name: Check pages and publication refresh behavior
        run: python -m unittest discover -s tests -v
      - name: Save refreshed publications
        if: github.event_name != 'pull_request'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if ! git diff --quiet -- research/publications.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/publications.md
            git commit -m "Refresh Google Scholar publications"
            git push origin "HEAD:$BRANCH_NAME"
          fi
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
